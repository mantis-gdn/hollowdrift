<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Opening SoundCloud — Hollow Drift</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#030305">
  <style>
    html,body{
      margin:0;
      min-height:100%;
      background:#030305;
      color:#f4f4f6;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    }
    body{
      min-height:100vh;
      display:grid;
      place-items:center;
    }
    .fallback{
      text-align:center;
      padding:24px;
      opacity:.7;
      font-size:14px;
    }
    a{ color:#f7c948; }
  </style>
</head>
<body>
  <div class="fallback">
    Opening SoundCloud…
    <noscript><br><br><a href="https://soundcloud.com/hollow-drift">Continue to SoundCloud</a></noscript>
  </div>

  <!-- Cloudflare Web Analytics -->
  <script
    type="module"
    src="https://static.cloudflareinsights.com/beacon.min.js"
    data-cf-beacon='{"token":"3454a87f86b94c099e6b988c87b2df5c"}'>
  </script>
  <!-- End Cloudflare Web Analytics -->

  <script>
    // Briefly allow the tracking page to load, then send the visitor onward.
    window.setTimeout(function(){
      window.location.replace("https://soundcloud.com/hollow-drift");
    }, 600);
  </script>
</body>
</html>
